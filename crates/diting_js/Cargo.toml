[package]
name = "diting_js"
version.workspace = true
edition = "2021"
description = "Diting engine: V8 runtime, ops, the snapshot (js/ + build.rs), WebSocket transport."
license = "Apache-2.0"
repository = "https://github.com/yinnho/diting"
publish = false

[features]
default = []
# Layout/paint-backed ops (layout_rect, paint_order, computed_style, canvas
# raster, screenshot) — without it they take the cfg(not) arms.
screenshot = ["dep:diting_layout"]
# No-op: the wire/BoringSSL stack is always built. Kept so `--features stealth` in
# CI, deploy and release commands keeps resolving.
stealth = []

[dependencies]
diting_env = { path = "../diting_env" }
diting_dom = { path = "../diting_dom" }
diting_css = { path = "../diting_css" }
diting_net = { path = "../diting_net" }
diting_layout = { path = "../diting_layout", optional = true }
# --- async runtime ---
tokio = { version = "1", features = ["full"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
serde_json = "1"
tracing = "0.1"
# Page-facing WebSocket transport: handshake runs over our own TcpStream/TLS
# stack (client_async validates the 101 upgrade itself); tokio-tungstenite is
# only the wire codec. 0.30 rides tungstenite 0.30 — sha1 0.11 + rand 0.10,
# same lines the rsa rc pins us to (0.24 dragged rand 0.8/rand_core 0.6/
# sha1 0.10/digest 0.10 duals). handshake (not connect): we dial ourselves.
tokio-tungstenite = { version = "0.30", default-features = false, features = [
    "handshake",
] }
http = "1"
# SOCKS tunneling for the WebSocket dial — vendored tokio-socks (0.5.3
# upstream, crates/VENDORED.md); the crates.io crate pins thiserror 1.
diting_socks = { path = "../diting_socks" }
url = "2"
diting_html5ever = { path = "../diting_html5ever" }
# --- V8 / JS runtime (claimed: diting_runtime, engine = v8 crate) ---
# Claim step 6 (docs/diting_runtime认领计划_20261017.md): deno_core is
# gone — the runtime layer (event loop, op settle pipeline, promise ring,
# snapshot container, foreground platform) is ours, and so is the
# serde_v8 surface op_glue used (buffer args, object returns) since the
# v8 152 bump.
diting_runtime = { path = "../diting_runtime" }
# Our op glue generator — replaces #[op2] one op family at a time (claim
# step 4; docs/diting_runtime认领计划_20261017.md).
diting_ops = { path = "../diting_ops" }
# Claim step 1 (docs/diting_runtime认领计划_20261017.md): direct pin on
# the engine-bindings crate (crates.io "v8"; deno_core's chain renames
# it deno_v8 -> rusty_v8, same crate underneath). Exact-pinned so engine
# bumps are our call (fingerprint self-consistency).
v8 = { version = "=152.2.0", default-features = false }
deno_error = "0.7"
base64 = "0.23"
sha1 = "0.11"
sha2 = "0.11"
# WebCrypto (crypto.subtle) secret-key primitives. RustCrypto, pure Rust, no
# CMake/OpenSSL, unify on the digest 0.10 / cipher 0.4 stack already in tree.
hmac = "0.13"
aes = "0.9"
# ghash: AES-GCM by hand (any IV length, truncated tags — Chrome takes
# both; aes-gcm pins them as type parameters). Same instance diting-browser's
# aes-gcm pulls in.
ghash = "0.6"
cbc = { version = "0.2", features = ["alloc"] }
pbkdf2 = { version = "0.13", default-features = false, features = ["hmac"] }
hkdf = "0.13"
# ECDSA (P-256/P-384) for crypto.subtle — same RustCrypto family as the
# secret-key ops, all four crates move in lockstep (0.14 rides ecdsa 0.17 +
# elliptic-curve 0.14 + rand_core 0.9). `ecdsa` is a direct dep for the
# hazmat prehash traits; p256/p384 with arithmetic+pkcs8 for key
# encode/decode. Key generation uses Generate::generate() (ambient OS RNG,
# enabled by the std→getrandom feature chain).
ecdsa = { version = "0.17", default-features = false, features = ["digest", "pkcs8", "pem", "std"] }
p256 = { version = "0.14", default-features = false, features = ["arithmetic", "ecdsa", "ecdh", "pkcs8", "std"] }
p384 = { version = "0.14", default-features = false, features = ["arithmetic", "ecdsa", "ecdh", "pkcs8", "std"] }
p521 = { version = "0.14", default-features = false, features = ["arithmetic", "ecdsa", "ecdh", "pkcs8", "std"] }
# sec1: the ECPrivateKey structure inside PKCS#8, decoded by hand so the
# import can check what Chrome checks (curve params, embedded public key).
# Same instance elliptic-curve already pulls in.
sec1 = { version = "0.8", default-features = false, features = ["der"] }
# Ed25519 for crypto.subtle: core sign/verify only; DER wrapping is done by hand
# in the JS shim (fixed 16/12-byte prefixes) and seeds come from op_random_bytes.
ed25519-dalek = { version = "3", default-features = false, features = ["fast", "zeroize", "alloc"] }
# rsa 0.10-rc: num-bigint → crypto-bigint, rides the digest 0.11 line
# (sha2 is a mandatory dep; our own sha1/sha2 0.11 pins are the same crate
# instances, so the scheme types bind directly — no feature pins needed).
# hazmat: the unchecked keygen — Chrome generates RSA from 512 bits, rsa's
# checked keygen floors at 1024 (the 512 floor is enforced in crypto_rsa.rs).
rsa = { version = "=0.10.0-rc.21", features = ["hazmat"] }
# rsa re-exports rand_core, so no own pin. getrandom rides 0.4 with the
# rsa rc (rand_core 0.6 → getrandom 0.2 is gone); sys_rng exposes SysRng
# implementing rand_core 0.10's TryRng.
getrandom = { version = "0.4", features = ["sys_rng"] }

[build-dependencies]
# 10d host flip: the snapshot is baked by OUR runtime crate (container
# format + creator), not deno_core's.
diting_runtime = { path = "../diting_runtime" }

[dev-dependencies]
# Test-only decode oracle for the hand-rolled canvas PNG encoder (#117).
# Same vendored crate as the render stack's — an oracle that ships its own
# copy would prove nothing about what we ship.
diting_png = { path = "../diting_png" }

[lints]
workspace = true
