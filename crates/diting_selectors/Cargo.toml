[package]
name = "diting_selectors"
version = "0.42.0"
edition = "2024"
description = "CSS selector matching engine (vendored from the selectors crate, maintained here)"
license = "MPL-2.0"
publish = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false

[lib]
name = "diting_selectors"
path = "lib.rs"
test = false
doctest = false

[features]

[dependencies]
bitflags = "2"
diting_cssparser = { path = "../diting_cssparser" }
derive_more = { version = "2", features = ["add", "add_assign"] }
hashbrown = "0.17"
log = "0.4"
new_debug_unreachable = "1"
precomputed-hash = "0.1"
rustc-hash = "2.1.1"
servo_arc = "0.6.0"
smallvec = "1.0"
