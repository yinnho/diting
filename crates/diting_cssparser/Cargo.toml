[package]
name = "diting_cssparser"
version = "0.38.0"
edition = "2024"
rust-version = "1.85"
description = "CSS tokenizer/parser (vendored from the cssparser crate, maintained here)"
license = "MPL-2.0"
publish = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false

[lib]
name = "diting_cssparser"
path = "src/lib.rs"
test = false
doctest = false

[features]
# Upstream defaults kept as-is (behavior-preserving intake): the fast faces
# cost cssparser-macros (proc-macro) + phf in the build but buy the
# jump-table tokenizer and the phf color table. Revisit with numbers, not
# at intake.
default = ["fast_match_byte", "fast_match_color"]
fast_match_byte = ["dep:cssparser-macros"]
fast_match_color = ["dep:phf"]
bench = []
skip_long_tests = []

[dependencies]
cssparser-macros = { version = "0.7.0", optional = true }
dtoa-short = "0.3"
itoa = "1.0"
malloc_size_of = { version = "0.1", optional = true, default-features = false }
phf = { version = "0.14.0", features = ["macros"], optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
smallvec = "1.0"
