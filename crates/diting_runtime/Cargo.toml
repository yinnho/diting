[package]
name = "diting_runtime"
version = "0.1.0"
edition = "2021"
description = "The Diting JS runtime crate: the event loop, op-settlement pipeline, and promise table we own — the deno_core retirement campaign (docs/diting_runtime认领计划_20261017.md)."
license = "Apache-2.0"
repository = "https://github.com/yinnho/diting"
publish = false

# One dependency, by design: V8 itself, pinned (same =152.2.0 as the rest of
# the workspace — one build, and version moves stay our decision, aligned with
# UA/TLS fingerprint declarations). Feature-for-feature the same declaration
# deno_core uses (simdutf, no defaults): a `-p diting_runtime` solo build
# then downloads the SAME prebuilt static lib as the full workspace build —
# v8's build script shares one gn_out/obj path per target dir, and two
# variants would clobber each other on every alternation.
[dependencies]
v8 = { version = "=152.2.0", default-features = false, features = ["simdutf"] }
# deno_error: op error classification (JsErrorBox/JsErrorClass); the
# crypto/fetch op bodies spell it in ~60 signatures. serde_v8 (and serde for
# its return face) was absorbed into op_glue on the v8 152 bump — it pinned
# v8 ^150 through deno_v8 and would have put two engines in the graph.
deno_error = "0.7"
# The module machinery's specifier type — deno_core aliases it the same way
# (`pub type ModuleSpecifier = Url`); after the retirement url remains ours.
url = "2"

[dev-dependencies]
# Integration tests define #[diting_op] ops and install them into a bare Vm.
# No deno_core here on purpose: the macro's remaining deno_core faces (state
# OpCtx decode, error conversion) don't appear in stateless test ops, proving
# the own-registration path is deno-free.
diting_ops = { path = "../diting_ops" }
# Pilot test compares probe JSON against the Chrome truth file.
serde_json = "1"

[lints]
workspace = true
