[package]
name = "diting_authoring"
description = "diting authoring cluster: page pump (PDF/PNG/JPEG), timeline video, OOXML (PPTX/DOCX) and docgen HTML"
version.workspace = true
edition = "2021"
publish = false

[features]
default = []
# The four rendering pieces (pages, video, ooxml, pptx_native) drive the
# engine's layout/paint; docgen is plain text and needs none of it.
screenshot = ["diting/screenshot"]

[dependencies]
diting = { path = "../diting" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
tracing = "0.1"
url = "2"
base64 = "0.23"
sha2 = "0.11"

[lints]
workspace = true
