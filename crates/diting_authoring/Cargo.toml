[package]
name = "diting_authoring"
description = "diting authoring cluster: page pump (PDF/PNG/JPEG), timeline video, OOXML (PPTX/DOCX) and docgen HTML"
version.workspace = true
edition = "2021"
publish = false

[features]
default = []
# The four rendering pieces (pages, video, ooxml, pptx_native) drive the
# engine's layout/paint; docgen is plain text and needs none of it.
screenshot = [
    "dep:diting",
    "diting/screenshot",
    "dep:tokio",
    "dep:tracing",
    "dep:url",
    "dep:base64",
]

[dependencies]
diting = { path = "../diting", optional = true }
tokio = { version = "1", features = ["full"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
tracing = { version = "0.1", optional = true }
url = { version = "2", optional = true }
base64 = { version = "0.23", optional = true }
sha2 = "0.11"

[lints]
workspace = true
