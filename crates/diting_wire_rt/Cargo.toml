[package]
publish = false
description = "diting browser-fidelity HTTP stack (diting_wire_rt); vendored from wreq-rt 0.2.2-rc.4 (Apache-2.0, 0x676e67) and maintained here"
build = false
edition = "2024"
rust-version = "1.85"
name = "diting_wire_rt"
version = "0.2.2-rc.4"
authors = ["0x676e67 <gngppz@gmail.com>"]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
license = "Apache-2.0"

[features]
compio-rt = []
default = [
    "tokio-rt",
]
tokio-rt = [
    "dep:tokio",
    "tokio?/rt",
    "tokio?/time",
    "dep:diting_wire_proto",
    "dep:pin-project-lite",
]

[lib]
name = "diting_wire_rt"
path = "src/lib.rs"
test = false
doctest = false

[dependencies.pin-project-lite]
version = "0.2.17"
optional = true

[dependencies.tokio]
version = "1.52.3"
optional = true
default-features = false

[dependencies.diting_wire_proto]
path = "../diting_wire_proto"
optional = true
