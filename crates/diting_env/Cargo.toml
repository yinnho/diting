[package]
name = "diting_env"
version.workspace = true
edition = "2021"
description = "Diting engine leaf: DITING_* runtime knobs and the claimed Chrome target (chrome-target.toml)."
license = "Apache-2.0"
repository = "https://github.com/yinnho/diting"
publish = false

[features]
default = []
# No-op: the wire/BoringSSL stack is always built. Kept so `--features stealth` in
# CI, deploy and release commands keeps resolving.
stealth = []

[dependencies]
url = "2"
diting_profiles = { path = "../diting_profiles" }

[lints]
workspace = true
