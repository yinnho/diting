[package]
# 产品包（原工作区根包，2026-11-05 结构整改 #5 搬入 crates/）。BINARY 是
# `diting`（[[bin]] below）——裸 `diting` 这个 crate 名归引擎（../diting）。
name = "diting-browser"
# 发版号单源在根 Cargo.toml [workspace.package]——diting-browser 和
# crates/diting 锁死同步继承。v0.9.2 前手抄两处，diting 卡 0.8.3 整月
# 没人发现（8b5fa03 才追平）。
version.workspace = true
edition = "2021"
authors = ["OpenCarrier Team"]
description = "Pure server-side browser engine with built-in V8. HTTP API for scraping, search, and interactive browsing. No Chromium required."
license = "Apache-2.0"
readme = "../../README.md"
repository = "https://github.com/yinnho/diting"
homepage = "https://browser.aginx.net"
keywords = ["browser", "http-api", "web-scraping", "headless", "automation"]
categories = ["web-programming", "network-programming", "command-line-utilities", "development-tools"]

# cargo-binstall: `cargo binstall diting-browser` grabs the GitHub release
# binary (with stealth+Screenshot features) instead of compiling V8 locally.
# All five targets ship the same shape since 0.9.0: diting-{version}-{target}.tar.gz
# holding diting-{version}-{target}/diting(.exe) (asset names carry no "v").
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/diting-{ version }-{ target }{ archive-suffix }"
bin-dir = "diting-{ version }-{ target }/{ bin }{ binary-ext }"

[features]
default = ["authoring"]
# Stealth HTTP client with TLS/JA3 fingerprint spoofing via wreq (BoringSSL),
# in the diting engine (crates/diting). Disable for plain reqwest-only builds.
stealth = ["diting/stealth", "dep:diting_profiles"]
# Screenshot rendering via the diting engine (crates/diting) — own
# CSS+layout+paint stack, no Chromium required, no blitz. The engine's
# render deps live in diting; the product face only needs encode/decode
# (PNG/JPEG re-encode of the engine's rendered bytes).
screenshot = ["diting/screenshot", "dep:diting_png", "diting_authoring?/screenshot"]
# Authoring cluster (crates/diting_authoring): /render and /render_markdown,
# plus /video and /pdf with screenshot. On by default so every existing build
# command ships it; `--no-default-features` builds the acquisition-only face.
authoring = ["dep:diting_authoring"]

[dependencies]
diting = { path = "../diting" }
diting_authoring = { path = "../diting_authoring", optional = true }
# --- async runtime ---
tokio = { version = "1", features = ["full"] }
futures = "0.3"
async-trait = "0.1"

# --- web framework ---
axum = "0.7"
tower-http = { version = "0.6", features = ["cors", "catch-panic"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
uuid = { version = "1", features = ["v4"] }

# --- serialization ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
libc = "0.2"

# --- docgen (render_markdown): markdown event stream + HTML emission ---
# Parser-only infrastructure (html5ever precedent); diagram vocabulary and
# layout arithmetic adapted from archify (MIT).
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }

# --- tracing ---
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# --- http client (non-stealth path; stealth lives in diting) ---
reqwest = { version = "0.13", features = ["cookies", "gzip", "brotli", "deflate", "rustls-no-provider", "socks", "json", "stream", "form", "query"], default-features = false }
http = "1"
url = "2"
urlencoding = "2"

# --- html / dom parsing (#42 ②: servo family vendored; htmlq = own query layer) ---
ego-tree = "0.11"
precomputed-hash = "0.1"
diting_html5ever = { path = "../diting_html5ever" }
diting_selectors = { path = "../diting_selectors" }
diting_cssparser = { path = "../diting_cssparser" }

base64 = "0.23"
sha2 = "0.11"

# --- stealth client (TLS fingerprint spoofing) ---
# The browser-fidelity HTTP stack is OUR code now (crates/diting_wire*, diting_profiles;
# vendored from wreq 6.0.0-rc.31 family, see crates/VENDORED.md). The product keeps the
# platform emulation presets used by search personas.
diting_profiles = { path = "../diting_profiles", optional = true }

# Retired 2026-11-06: the blitz reference pipeline (DioxusLabs/blitz rev-pinned
# + stylo_alias + a parley/fontique/anyrender/peniko fixture stack, feeding
# bridge_cross_check.rs / screenshot_reference.rs) was deleted — the dual-engine
# oracle had been superseded by the real-Chrome probe battery, carried six git
# packages and a second taffy (0.14) in the lock, and compiled into nothing
# (test-only feature no CI job enabled). History: the pin was 916fa89 for #878
# (metrics-derived line-height normal); the yinnho/blitz fork retired earlier
# via upstream blitz#636.
# Vendored png 0.18.1 (#42 ④) — the product face's PNG encode/decode;
# JPEG re-encode goes through diting_layout::image's house encoder.
diting_png = { path = "../diting_png", optional = true }
rusqlite = { version = "0.41.1", features = ["bundled"] }

aes-gcm = "0.11"
# #26 browser-profile import: Chrome macOS cookies are AES-128-CBC under a
# PBKDF2-HMAC-SHA1 key; the snapshot copy of the profile db lives in a
# private TempDir. Same versions the engine's WebCrypto already locks.
aes = "0.9"
cbc = { version = "0.2", features = ["alloc"] }
pbkdf2 = { version = "0.13", default-features = false, features = ["hmac"] }
sha1 = "0.11"
tempfile = "3"
[[bin]]
name = "diting"
path = "src/main.rs"

[dev-dependencies]
# auth.rs gate tests drive the axum Router via ServiceExt::oneshot (same
# version axum 0.7.9 already compiles into the tree).
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
