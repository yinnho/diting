[package]
name = "diting_net"
version.workspace = true
edition = "2021"
description = "Diting engine: HTTP client (plain reqwest + stealth wire stack), cookies, encodings, site/PSL tables."
license = "Apache-2.0"
repository = "https://github.com/yinnho/diting"
publish = false

[features]
default = []
# Stealth HTTP client with TLS/JA3 fingerprint spoofing via wreq (BoringSSL).
# Disable for plain reqwest-only builds.
stealth = ["dep:diting_wire", "dep:diting_profiles", "diting_env/stealth"]

[dependencies]
diting_env = { path = "../diting_env" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
# --- http client (non-stealth path) ---
reqwest = { version = "0.13", features = ["cookies", "gzip", "brotli", "deflate", "rustls-no-provider", "socks", "json", "stream", "form", "query"], default-features = false }
# Same versions the tree already carries (reqwest rustls-tls path) — pinning
# the same lines keeps the lockfile free of duplicate major versions.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
encoding_rs = "0.8"
tempfile = "3"
url = "2"
# --- stealth client (TLS fingerprint spoofing) ---
# The browser-fidelity HTTP stack lives in this repository (vendored from the wreq
# family, see crates/VENDORED.md) - no external pre-release pins to track.
diting_profiles = { path = "../diting_profiles", optional = true }

# prefix-symbols renames BoringSSL exports to avoid clashing with system OpenSSL,
# but the renaming is only correct on Linux/Android (per the wreq README it came from).
[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
diting_wire = { path = "../diting_wire", optional = true, features = ["prefix-symbols", "socks", "gzip", "brotli", "deflate", "zstd"] }

[target.'cfg(not(any(target_os = "linux", target_os = "android")))'.dependencies]
diting_wire = { path = "../diting_wire", optional = true, features = ["socks", "gzip", "brotli", "deflate", "zstd"] }

[lints]
workspace = true
