[package]
name = "diting_net"
version.workspace = true
edition = "2021"
description = "Diting engine: HTTP client (diting_wire, plain and Chrome-emulating), cookies, encodings, site/PSL tables."
license = "Apache-2.0"
repository = "https://github.com/yinnho/diting"
publish = false

[features]
default = []
# No-op: the wire/BoringSSL stack is always built. Kept so `--features stealth` in
# CI, deploy and release commands keeps resolving.
stealth = []

[dependencies]
diting_env = { path = "../diting_env" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
encoding_rs = "0.8"
tempfile = "3"
url = "2"
# --- http stack (plain and emulating clients) ---
# The browser-fidelity HTTP stack lives in this repository (vendored from the wreq
# family, see crates/VENDORED.md) - no external pre-release pins to track.
diting_profiles = { path = "../diting_profiles" }

# prefix-symbols renames BoringSSL exports to avoid clashing with system OpenSSL,
# but the renaming is only correct on Linux/Android (per the wreq README it came from).
[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
diting_wire = { path = "../diting_wire", features = ["prefix-symbols", "socks", "gzip", "brotli", "deflate", "zstd"] }

[target.'cfg(not(any(target_os = "linux", target_os = "android")))'.dependencies]
diting_wire = { path = "../diting_wire", features = ["socks", "gzip", "brotli", "deflate", "zstd"] }

[lints]
workspace = true
