[package]
name = "diting"
# 和 root(diting-browser) 锁死同步——单源见根 Cargo.toml [workspace.package]
version.workspace = true
edition = "2021"
description = "The Diting (谛听) browser engine: network → DOM → CSS → layout → paint, V8 runtime, the Page API. Foundation of Diting."
license = "Apache-2.0"
repository = "https://github.com/yinnho/diting"
publish = false

[features]
default = []
# Stealth HTTP client with TLS/JA3 fingerprint spoofing via wreq (BoringSSL).
# Disable for plain reqwest-only builds.
stealth = ["dep:diting_wire", "dep:diting_profiles"]
# Screenshot rendering via the diting engine (own CSS+layout+paint
# stack on the taffy/swash/vello_cpu foundation). Opt-in; renders the
# JS-rendered DOM (captured by the diting V8 path) to a PNG — no Chromium
# required. (The blitz reference pipeline and its parley FontContext
# surface were retired 2026-11-06; diting's text stack is swash + its
# own greedy_wrap, zero parley.)
screenshot = [
    "dep:png",
    # JPEG/WebP/GIF decode for diting_layout's ImageCache (batches 6d/7b/7e).
    # Animated GIFs take the first frame. `png` is needed by the CDP legacy
    # path, which re-encodes JPEG captures from the rendered PNG bytes.
    "dep:image",
    "image/jpeg",
    "image/png",
    "image/webp",
    "image/gif",
    # Taffy does diting's box layout.
    "dep:taffy",
    # Real glyph measurement + rasterization for diting_layout text leaves
    # (render claim batches 3a/3b). Same stack upstream obscura-render builds
    # on. scale/render are the outline raster features (3b paint).
    "dep:swash",
]

[dependencies]
# Taffy 0.15.x (2026-10-12, #270), patched to upstream main 802e497 in the
# root Cargo.toml for the float tail-segment fix (#300: a float extending
# past the segment list's last end had that extent dropped, so lines beside
# it wrapped full-width; see the [patch.crates-io] note). The retired git
# pin before 0.15.0 tracked blitz main (4142c9d→2d936b77, 2026-10-09) for
# taffy #1286
# indefinite percentage flex-basis (falls back to content sizing instead
# of collapsing to 0, our #241), the #1278-#1284 grid family, and the
# block-layout vertical-margins rework; 0.15.0 = that rev + #1293/#1242 +
# the release bump, so the pin is gone. (The second taffy copy — 0.14.0,
# riding along with the blitz reference pipeline — left the tree when that
# pipeline was deleted 2026-11-06; 0.15 is now the only taffy.)
# taffy_tree is additionally listed because the unified graph already enables
# it (Cargo.lock shows taffy pulling slotmap) — an explicit no-op.
# Used by diting_layout box layout and the fork-delta tests (docs/engine/render.md).
taffy = { version = "0.15", optional = true, default-features = false, features = [
    "std",
    "taffy_tree",
    "flexbox",
    "flexbox_balance",
    "grid",
    "block_layout",
    "content_size",
    "calc",
    "detailed_layout_info",
    # Probe (#299): taffy's own float placement engine; unused by production
    # layout until the probe proves it.
    "float_layout",
] }
# Shaped advances + font metrics (batch 3a) and glyph rasterization (3b) for
# diting_layout text leaves. Same stack upstream obscura-render builds on.
# default-features=false + explicit std/scale/render: no variations/simd knob
# we don't use (default set is std+scale+render anyway — pin it explicitly).
swash = { version = "0.2", optional = true, default-features = false, features = [
    "std",
    "scale",
    "render",
] }
# (parley/fontique were the retired blitz-reference fixture stack's shaping
# stack — diting itself shapes via swash; removed with the pipeline 2026-11-06.)
# --- async runtime ---
tokio = { version = "1", features = ["full"] }
futures = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
uuid = { version = "1", features = ["v4"] }

# --- serialization ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# --- tracing ---
tracing = "0.1"

# --- http client (non-stealth path) ---
reqwest = { version = "0.13", features = ["cookies", "gzip", "brotli", "deflate", "rustls-no-provider", "webpki-roots", "socks", "json", "stream", "form", "query"], default-features = false }
# Page-facing WebSocket transport: handshake runs over our own TcpStream/TLS
# stack (client_async validates the 101 upgrade itself); tokio-tungstenite is
# only the wire codec. 0.30 rides tungstenite 0.30 — sha1 0.11 + rand 0.10,
# same lines the rsa rc pins us to (0.24 dragged rand 0.8/rand_core 0.6/
# sha1 0.10/digest 0.10 duals). handshake (not connect): we dial ourselves.
tokio-tungstenite = { version = "0.30", default-features = false, features = [
    "handshake",
] }
http = "1"
# Same versions the tree already carries (reqwest rustls-tls path) — pinning
# the same lines keeps the lockfile free of duplicate major versions.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
webpki-roots = "1.0"
# SOCKS tunneling for the WebSocket dial — vendored tokio-socks (0.5.3
# upstream, crates/VENDORED.md); the crates.io crate pins thiserror 1.
diting_socks = { path = "../diting_socks" }
encoding_rs = "0.8"
tempfile = "3"
url = "2"

# --- html / dom parsing ---
html5ever = "0.40"
selectors = "0.42"
cssparser = "0.38"
precomputed-hash = "0.1"

# --- V8 / JS runtime (claimed: diting_runtime, engine = v8 crate) ---
# Claim step 6 (docs/diting_runtime认领计划_20261017.md): deno_core is
# gone — the runtime layer (event loop, op settle pipeline, promise ring,
# snapshot container, foreground platform) is ours, and so is the
# serde_v8 surface op_glue used (buffer args, object returns) since the
# v8 152 bump.
diting_runtime = { path = "../diting_runtime" }
# Our op glue generator — replaces #[op2] one op family at a time (claim
# step 4; docs/diting_runtime认领计划_20261017.md).
diting_ops = { path = "../diting_ops" }
# Claim step 1 (docs/diting_runtime认领计划_20261017.md): direct pin on
# the engine-bindings crate (crates.io "v8"; deno_core's chain renames
# it deno_v8 -> rusty_v8, same crate underneath). Exact-pinned so engine
# bumps are our call (fingerprint self-consistency).
v8 = { version = "=152.2.0", default-features = false }
deno_error = "0.7"
base64 = "0.23"
sha1 = "0.11"
sha2 = "0.11"
# WebCrypto (crypto.subtle) secret-key primitives. RustCrypto, pure Rust, no
# CMake/OpenSSL, unify on the digest 0.10 / cipher 0.4 stack already in tree.
hmac = "0.13"
aes = "0.9"
aes-gcm = "0.11"
cbc = { version = "0.2", features = ["alloc"] }
ctr = "0.10"
pbkdf2 = { version = "0.13", default-features = false, features = ["hmac"] }
hkdf = "0.13"
# ECDSA (P-256/P-384) for crypto.subtle — same RustCrypto family as the
# secret-key ops, all four crates move in lockstep (0.14 rides ecdsa 0.17 +
# elliptic-curve 0.14 + rand_core 0.9). `ecdsa` is a direct dep for the
# hazmat prehash traits; p256/p384 with arithmetic+pkcs8 for key
# encode/decode. Key generation uses Generate::generate() (ambient OS RNG,
# enabled by the std→getrandom feature chain).
ecdsa = { version = "0.17", default-features = false, features = ["digest", "pkcs8", "pem", "std"] }
p256 = { version = "0.14", default-features = false, features = ["arithmetic", "ecdsa", "ecdh", "pkcs8", "std"] }
p384 = { version = "0.14", default-features = false, features = ["arithmetic", "ecdsa", "ecdh", "pkcs8", "std"] }
# Ed25519 for crypto.subtle: core sign/verify only; DER wrapping is done by hand
# in the JS shim (fixed 16/12-byte prefixes) and seeds come from op_random_bytes.
ed25519-dalek = { version = "3", default-features = false, features = ["fast", "zeroize", "alloc"] }
# Memory-mapped system fonts (the 183 MB color-emoji face stays on disk until
# glyphs are touched). Already in the tree via fontique/parley.
memmap2 = "0.9"
# CSPRNG for getRandomValues / randomUUID (replaces Math.random) — see the
# getrandom pin down with the rsa rc block.

# --- stealth client (TLS fingerprint spoofing) ---
# The browser-fidelity HTTP stack lives in this repository (vendored from the wreq
# family, see crates/VENDORED.md) - no external pre-release pins to track.
# prefix-symbols renames BoringSSL exports to avoid clashing with system OpenSSL,
# but the renaming is only correct on Linux/Android (per the wreq README it came from).
diting_profiles = { path = "../diting_profiles", optional = true }

# --- render output encoding (screenshot) ---
png = { version = "0.18", optional = true }
# Same version blitz-dom pins (0.25.x); jpeg/webp/gif are the only features we need.
image = { version = "0.25", optional = true, default-features = false, features = ["jpeg", "webp", "gif"] }
# rsa 0.10-rc: num-bigint → crypto-bigint, rides the digest 0.11 line
# (sha2 is a mandatory dep; our own sha1/sha2 0.11 pins are the same crate
# instances, so the scheme types bind directly — no feature pins needed).
rsa = "=0.10.0-rc.21"
# rsa re-exports rand_core, so no own pin. getrandom rides 0.4 with the
# rsa rc (rand_core 0.6 → getrandom 0.2 is gone); sys_rng exposes SysRng
# implementing rand_core 0.10's TryRng.
getrandom = { version = "0.4", features = ["sys_rng"] }

[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
diting_wire = { path = "../diting_wire", optional = true, features = ["prefix-symbols", "socks", "gzip", "brotli", "deflate", "zstd"] }

[target.'cfg(not(any(target_os = "linux", target_os = "android")))'.dependencies]
diting_wire = { path = "../diting_wire", optional = true, features = ["socks", "gzip", "brotli", "deflate", "zstd"] }

[build-dependencies]
# 10d host flip: the snapshot is baked by OUR runtime crate (container
# format + creator), not deno_core's.
diting_runtime = { path = "../diting_runtime" }

[dev-dependencies]
# Test-only decode oracle for the hand-rolled canvas PNG encoder (#117):
# the product never links it in default builds (it stays behind `screenshot`).
png = "0.18"

[lints]
workspace = true
