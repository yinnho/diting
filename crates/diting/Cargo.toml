[package]
name = "diting"
# 和 root(diting-browser) 锁死同步——单源见根 Cargo.toml [workspace.package]
version.workspace = true
edition = "2021"
description = "The Diting (谛听) browser engine: network → DOM → CSS → layout → paint, V8 runtime, the Page API. Facade over the diting_* engine crates."
license = "Apache-2.0"
repository = "https://github.com/yinnho/diting"
publish = false

# 门面（#58 拆包）：引擎本体分住 diting_env / diting_dom / diting_css /
# diting_layout / diting_net / diting_js / diting_page，这里只 re-export 原
# 路径（diting::diting_dom 等）+ 烙 BUILD_COMMIT。feature 在这层一次打开全链。
[features]
default = []
# Stealth HTTP client with TLS/JA3 fingerprint spoofing via wreq (BoringSSL).
# Disable for plain reqwest-only builds.
stealth = ["diting_env/stealth", "diting_net/stealth", "diting_js/stealth", "diting_page/stealth"]
# Screenshot rendering via the diting engine (own CSS+layout+paint
# stack on the taffy/swash/vello_cpu foundation). Opt-in; renders the
# JS-rendered DOM (captured by the diting V8 path) to a PNG — no Chromium
# required.
screenshot = ["dep:diting_layout", "diting_js/screenshot", "diting_page/screenshot"]

[dependencies]
diting_env = { path = "../diting_env" }
diting_dom = { path = "../diting_dom" }
diting_css = { path = "../diting_css" }
diting_layout = { path = "../diting_layout", optional = true }
diting_net = { path = "../diting_net" }
diting_js = { path = "../diting_js" }
diting_page = { path = "../diting_page" }

[lints]
workspace = true
