<!DOCTYPE html>
<!-- id: zodiac_cover  十二星座周运势 · 图文封面页（1080x460，公众号封面 2.35:1）
     零槽位：周号/日期/本周星象与 zodiac.html 同源自动算，同周渲染一致。
     静态页无时间线，配 /screenshot {"html":全文,"width":1080,"height":460}。
     分享卡片取中心 1:1 裁切——主文案居中放置，避开左右裁切。
     真元素装饰（REQ #415）。家族：weather/reply/zodiac 磷光读数页。 -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080">
<title>十二星座本周运势 · 封面</title>
<style>
:root {
  --bg: #060a07;
  --bg-glow: #0d1811;
  --fg: #d8e6d8;
  --accent: #3dfd8f;
  --muted: #7d9484;
  --dim: #23352a;
  --scan: rgba(63, 221, 143, 0.03);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--bg); }
body {
  width: 1080px; height: 460px; overflow: hidden;
  color: var(--fg);
  font: 400 38px/1.7 ui-monospace, "Noto Sans Mono", monospace;
  position: relative; text-align: center;
}
.fx {
  position: fixed; inset: 0; pointer-events: none; z-index: 90;
  background:
    repeating-linear-gradient(to bottom, var(--scan) 0 1px, transparent 1px 6px),
    radial-gradient(120% 60% at 50% 0%, var(--bg-glow), transparent 70%),
    linear-gradient(to bottom, transparent 80%, rgba(0,0,0,0.5));
}
.stars-layer { position: fixed; inset: 0; pointer-events: none; z-index: 1; }
.stars-layer span { position: absolute; color: var(--accent); }
.wrap { position: relative; z-index: 10; padding-top: 78px; }
.cmd { color: var(--muted); font-size: 24px; }
.cmd .p { color: var(--accent); }
.h1 { margin-top: 26px; font-size: 108px; line-height: 1.15; font-weight: 600; letter-spacing: 0.06em; }
.h1 em { font-style: normal; color: var(--accent); }
.range { margin-top: 30px; font-size: 40px; color: var(--fg); }
.range .sep { color: var(--dim); padding: 0 18px; }
.range .wk { color: var(--accent); }
.note { margin-top: 16px; font-size: 28px; color: var(--muted); }
.note b { color: var(--fg); font-weight: 400; }
</style>
</head>
<body>
<div class="stars-layer" id="dust"></div>
<div class="fx" aria-hidden="true"></div>
<div class="wrap">
  <p class="cmd"><span class="p">&gt; </span>horoscope --week <span id="wkTag"></span></p>
  <p class="h1">十二星座 <em>本周运势</em></p>
  <p class="range"><span id="d0"></span><span class="sep">—</span><span id="d1"></span><span class="sep">·</span><span class="wk" id="wn"></span></p>
  <p class="note">本周星象：<b id="wkNote"></b></p>
</div>
<script>
(function () {
  var FORCE = null;   /* 例：{year:2026, week:46, d0:'11.09', d1:'11.15'} */
  function pad2(n) { return (n < 10 ? '0' : '') + n; }
  function isoCal(d) {
    var t = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    var dow = (t.getDay() + 6) % 7;
    var thu = new Date(t.getFullYear(), t.getMonth(), t.getDate() - dow + 3);
    var j4 = new Date(thu.getFullYear(), 0, 4);
    var jd = (j4.getDay() + 6) % 7;
    var j4thu = new Date(j4.getFullYear(), 0, 4 - jd + 3);
    var week = Math.round((thu - j4thu) / 604800000) + 1;
    var mon = new Date(thu.getFullYear(), thu.getMonth(), thu.getDate() - 3);
    var sun = new Date(mon.getFullYear(), mon.getMonth(), mon.getDate() + 6);
    return { year: thu.getFullYear(), week: week,
             d0: pad2(mon.getMonth() + 1) + '.' + pad2(mon.getDate()),
             d1: pad2(sun.getMonth() + 1) + '.' + pad2(sun.getDate()) };
  }
  var cal = FORCE || isoCal(new Date());
  var NOTES = ["金星入庙，暖意先行","满月收尾，旧事清账","火象主扬，宜快不宜拖",
    "水象主静，蓄力为上","风向聚议，多听少辩","土象固本，落袋为安",
    "新月开局，许愿要早","水星逆行，回看旧路","木星撑腰，格局放大",
    "火星换座，节奏重排","水星顺行，暗流回稳","日月同宫，内外合一"];
  document.getElementById('wkTag').textContent = cal.year + '-W' + cal.week;
  document.getElementById('d0').textContent = cal.d0;
  document.getElementById('d1').textContent = cal.d1;
  document.getElementById('wn').textContent = 'W' + cal.week;
  document.getElementById('wkNote').textContent = NOTES[cal.week % NOTES.length];
  function rng(seed) {
    var a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var sr = rng(cal.year * 100 + cal.week);
  var dust = document.getElementById('dust');
  for (var s = 0; s < 26; s++) {
    var dot = document.createElement('span');
    dot.textContent = '·';
    dot.style.left = Math.floor(sr() * 1040) + 'px';
    dot.style.top = Math.floor(sr() * 460) + 'px';
    dot.style.fontSize = (20 + Math.floor(sr() * 44)) + 'px';
    dot.style.opacity = (0.05 + sr() * 0.12).toFixed(2);
    dust.appendChild(dot);
  }
})();
</script>
</body>
</html>
