<!DOCTYPE html>
<!-- id: zodiac_sign  单星座本周运势 · 12s 竖屏确定性视频页（diting /video 管线）
     槽位 {{sign}}：目标星座序号，十进制整数 0=白羊 … 11=双鱼（SIGNS 顺序），
     调用方生成 HTML 时整体替换 `var SIGN = {{sign}};`。
     内容种子与合辑版 zodiac.html 完全一致（mulberry32(week*31 + sign*7 + isoYear)），
     同周同星座重渲字节级一致；周号/日期/本周星象运行时按 ISO 周自动算，
     FORCE 可锁历史周回归。
     时间线 2.4 开场 + 2.6 星级 + 3.0 关键词 + 2.2 宜忌 + 1.8 结尾 = 12.0s，24fps；
     动画只写 transform/opacity（#395/#398 廉价失效路径）；真元素装饰（REQ #415）。
     家族：weather/reply/zodiac 磷光读数页。
     渲染：POST /video {"html":替换后全文, "fps":24, "width":1080, "height":1920} -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080">
<title>本周运势</title>
<style>
:root {
  --bg: #060a07;
  --bg-glow: #0d1811;
  --fg: #d8e6d8;
  --accent: #3dfd8f;
  --muted: #7d9484;
  --dim: #23352a;
  --scan: rgba(63, 221, 143, 0.03);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--bg); }
body {
  width: 1080px; height: 1920px; overflow: hidden;
  color: var(--fg);
  font: 400 38px/1.7 ui-monospace, "Noto Sans Mono", monospace;
  position: relative;
}
.fx {
  position: fixed; inset: 0; pointer-events: none; z-index: 90;
  background:
    repeating-linear-gradient(to bottom, var(--scan) 0 1px, transparent 1px 6px),
    radial-gradient(120% 46% at 50% 0%, var(--bg-glow), transparent 70%),
    linear-gradient(to bottom, transparent 76%, rgba(0,0,0,0.55));
}
/* 星尘层：真 span 点，容器只做 transform 漂移 */
.stars-layer { position: fixed; inset: -300px 0 0 0; pointer-events: none; z-index: 1; }
.stars-layer span { position: absolute; color: var(--accent); }
/* 卡片层：5 张叠放，动画只碰 opacity/transform */
.card {
  position: fixed; inset: 0; padding: 150px 88px 130px;
  opacity: 0; transform: translateY(46px); z-index: 10;
}
.cmd { color: var(--muted); font-size: 30px; border-bottom: 1px solid var(--dim); padding-bottom: 30px; }
.cmd .p { color: var(--accent); }
.label { margin-top: 130px; font-size: 40px; color: var(--muted); letter-spacing: 0.3em; }
/* c0 开场 */
.h1 { margin-top: 150px; font-size: 216px; line-height: 1.22; font-weight: 600; letter-spacing: 0.04em; }
.smeta { margin-top: 24px; font-size: 46px; color: var(--muted); letter-spacing: 0.18em; }
.range { margin-top: 70px; font-size: 52px; color: var(--fg); }
.range .sep { color: var(--dim); padding: 0 20px; }
.weeknote { margin-top: 30px; font-size: 36px; color: var(--muted); }
.weeknote b { color: var(--fg); font-weight: 400; }
/* c1 星级 */
.rate-big { margin-top: 90px; font-size: 170px; letter-spacing: 44px; line-height: 1; }
.rate-big .st { color: var(--muted); opacity: 0.16; }
.rate-big .st.on { color: var(--accent); opacity: 1; }
.score { margin-top: 120px; font-size: 110px; line-height: 1.2; opacity: 0; }
.score em { font-style: normal; color: var(--accent); font-weight: 600; }
.score .of { color: var(--muted); font-size: 64px; }
/* c2 关键词 */
.kw { margin-top: 70px; font-size: 150px; line-height: 1.35; color: var(--accent); font-weight: 600; opacity: 0; }
.adv { margin-top: 90px; font-size: 56px; line-height: 1.7; color: var(--fg); max-width: 900px; opacity: 0; }
/* c3 宜忌 */
.spec { margin-top: 40px; max-width: 920px; }
.spec .row { display: flex; align-items: baseline; padding: 40px 0; border-bottom: 1px solid var(--dim); opacity: 0; transform: translateY(18px); }
.spec .row:first-child { border-top: 1px solid var(--dim); }
.spec .k { color: var(--muted); font-size: 38px; white-space: nowrap; }
.spec .fill { flex: 1; margin: 0 24px; border-bottom: 3px dotted var(--dim); transform: translateY(-10px); }
.spec .v { color: var(--fg); font-size: 52px; font-weight: 600; white-space: nowrap; }
.spec .v em { font-style: normal; color: var(--accent); }
/* c4 结尾 */
.out1 { margin-top: 320px; font-size: 120px; line-height: 1.5; font-weight: 600; }
.out1 em { font-style: normal; color: var(--accent); }
.out2 { margin-top: 70px; font-size: 44px; color: var(--muted); }
/* 角标 */
.tag { position: fixed; left: 88px; bottom: 74px; font-size: 26px; color: var(--dim); z-index: 20; }
.tag .k2 { color: var(--muted); }
.src { position: fixed; right: 88px; bottom: 74px; font-size: 26px; color: var(--dim); z-index: 20; }
.src .k2 { color: var(--muted); }
</style>
</head>
<body>
<div class="stars-layer" id="dust"></div>
<div class="fx" aria-hidden="true"></div>

<div class="card" id="c0">
  <p class="cmd"><span class="p">&gt; </span><span id="cmd0"></span></p>
  <p class="h1" id="nm"></p>
  <p class="smeta" id="mt"></p>
  <p class="range"><span id="d0"></span><span class="sep">—</span><span id="d1"></span><span class="sep">·</span>W<span id="wn"></span></p>
  <p class="weeknote">本周星象：<b id="wkNote"></b></p>
</div>

<div class="card" id="c1">
  <p class="cmd"><span class="p">&gt; </span><span id="cmd1"></span></p>
  <p class="label">综合运势 · COMPOSITE</p>
  <p class="rate-big" id="rate">
    <span class="st">★</span><span class="st">★</span><span class="st">★</span><span class="st">★</span><span class="st">★</span>
  </p>
  <p class="score" id="score"></p>
</div>

<div class="card" id="c2">
  <p class="cmd"><span class="p">&gt; </span><span id="cmd2"></span></p>
  <p class="label">本周关键词 · KEYWORD</p>
  <p class="kw" id="kw"></p>
  <p class="adv" id="adv"></p>
</div>

<div class="card" id="c3">
  <p class="cmd"><span class="p">&gt; </span><span id="cmd3"></span></p>
  <p class="label">本周宜忌 · LUCK</p>
  <div class="spec" id="spec"></div>
</div>

<div class="card" id="c4">
  <p class="cmd"><span class="p">&gt; </span>horoscope --next-week</p>
  <p class="out1">下周见。<br><em>好运常驻。</em></p>
  <p class="out2">关注不迷路 · 每周一更</p>
</div>

<p class="tag"><span class="k2">sign: </span><span id="tagName"></span></p>
<p class="src"><span class="k2">render: </span>diting /video · deterministic</p>

<script>
(function () {
  /* ---- 星座选择（{{sign}} 槽）与周期锁定 ---- */
  var SIGN = {{sign}};               /* 0=白羊 … 11=双鱼 */
  var FORCE = null;                  /* 例：{year:2026, week:46, d0:'11.09', d1:'11.15'} */
  function pad2(n) { return (n < 10 ? '0' : '') + n; }
  function isoCal(d) {
    var t = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    var dow = (t.getDay() + 6) % 7;                 /* Mon=0..Sun=6 */
    var thu = new Date(t.getFullYear(), t.getMonth(), t.getDate() - dow + 3);
    var j4 = new Date(thu.getFullYear(), 0, 4);
    var jd = (j4.getDay() + 6) % 7;
    var j4thu = new Date(j4.getFullYear(), 0, 4 - jd + 3);
    var week = Math.round((thu - j4thu) / 604800000) + 1;
    var mon = new Date(thu.getFullYear(), thu.getMonth(), thu.getDate() - 3);
    var sun = new Date(mon.getFullYear(), mon.getMonth(), mon.getDate() + 6);
    return { year: thu.getFullYear(), week: week,
             d0: pad2(mon.getMonth() + 1) + '.' + pad2(mon.getDate()),
             d1: pad2(sun.getMonth() + 1) + '.' + pad2(sun.getDate()) };
  }
  var cal = FORCE || isoCal(new Date());
  var YEAR = cal.year, WEEK = cal.week;

  /* ---- 确定性内容：与 zodiac.html 同式 mulberry32(week*31 + i*7 + isoYear) ---- */
  var SIGNS = [
    ["白羊座","ARIES","3.21—4.19"], ["金牛座","TAURUS","4.20—5.20"],
    ["双子座","GEMINI","5.21—6.21"], ["巨蟹座","CANCER","6.22—7.22"],
    ["狮子座","LEO","7.23—8.22"], ["处女座","VIRGO","8.23—9.22"],
    ["天秤座","LIBRA","9.23—10.23"], ["天蝎座","SCORPIO","10.24—11.22"],
    ["射手座","SAGITTARIUS","11.23—12.21"], ["摩羯座","CAPRICORN","12.22—1.19"],
    ["水瓶座","AQUARIUS","1.20—2.18"], ["双鱼座","PISCES","2.19—3.20"]
  ];
  var NOTES = ["金星入庙，暖意先行","满月收尾，旧事清账","火象主扬，宜快不宜拖",
    "水象主静，蓄力为上","风向聚议，多听少辩","土象固本，落袋为安",
    "新月开局，许愿要早","水星逆行，回看旧路","木星撑腰，格局放大",
    "火星换座，节奏重排","水星顺行，暗流回稳","日月同宫，内外合一"];
  var KWS = ["锋面过境","引力回升","暗流平息","信号清晰","轨道交会","静风蓄势","潮位回涨","热斑转移","视界打开","杂音退散","重心下沉","缺环补齐"];
  var ADVS = ["宜先手，后发则被动","把悬而未决的事收口","旧线索里藏新答案","答应自己的事先兑现","慢半拍反而是优势","别替别人的课题消耗自己","直觉准，但别声张","该拒绝的那次就拒绝","小赢积成大势","盯过程，结果自己来","留白处正是转机","先立界限，再谈给予"];
  var COLORS = ["磷光绿","雾紫","铁灰","暖橙","月白","黛蓝","砂金","苔原绿","烟粉","藏青","琥珀","银灰"];
  var YI = ["先手","复盘","断舍离","示弱","闭环","远行","表白","签约","独处","开工","提薪","撒手"];
  var JI = ["逞强","口头承诺","深夜决定","翻旧账","抢答","代劳","贪杯","硬刚","all in","内耗","迟到","回群"];
  function rng(seed) {
    var a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var r = rng(WEEK * 31 + SIGN * 7 + YEAR);
  var D = {
    name: SIGNS[SIGN][0], en: SIGNS[SIGN][1], range: SIGNS[SIGN][2],
    stars: 2 + Math.floor(r() * 4),          /* 2..5 */
    kw: KWS[Math.floor(r() * KWS.length)],
    adv: ADVS[Math.floor(r() * ADVS.length)],
    color: COLORS[Math.floor(r() * COLORS.length)],
    num: 1 + Math.floor(r() * 9),
    yi: YI[Math.floor(r() * YI.length)],
    ji: JI[Math.floor(r() * JI.length)]
  };
  var TAG = YEAR + '-W' + WEEK;
  document.getElementById('cmd0').textContent = 'horoscope --week ' + TAG + ' ' + D.name;
  document.getElementById('cmd1').textContent = 'horoscope --rate ' + D.en;
  document.getElementById('cmd2').textContent = 'horoscope --keyword ' + D.en;
  document.getElementById('cmd3').textContent = 'horoscope --luck ' + D.en;
  document.getElementById('nm').textContent = D.name;
  document.getElementById('mt').textContent = D.en + ' · ' + D.range;
  document.getElementById('d0').textContent = cal.d0;
  document.getElementById('d1').textContent = cal.d1;
  document.getElementById('wn').textContent = WEEK;
  document.getElementById('wkNote').textContent = NOTES[WEEK % NOTES.length];
  document.getElementById('score').innerHTML = '<em>' + D.stars + '.0</em> <span class="of">/ 5</span>';
  document.getElementById('kw').textContent = '「' + D.kw + '」';
  document.getElementById('adv').textContent = D.adv;
  document.getElementById('tagName').textContent = D.name + ' · ' + TAG;
  document.getElementById('spec').innerHTML =
    '<div class="row"><span class="k">幸运色</span><span class="fill"></span><span class="v">' + D.color + '</span></div>' +
    '<div class="row"><span class="k">幸运数字</span><span class="fill"></span><span class="v"><em>' + D.num + '</em></span></div>' +
    '<div class="row"><span class="k">宜</span><span class="fill"></span><span class="v">' + D.yi + '</span></div>' +
    '<div class="row"><span class="k">忌</span><span class="fill"></span><span class="v">' + D.ji + '</span></div>';

  /* 星尘：静态点，容器慢漂移（12s×6px/s=72px，层高预留） */
  var dust = document.getElementById('dust');
  var sr = rng(YEAR * 100 + WEEK);
  for (var s = 0; s < 42; s++) {
    var dot = document.createElement('span');
    dot.textContent = '·';
    dot.style.left = Math.floor(sr() * 1040) + 'px';
    dot.style.top = Math.floor(sr() * 2150) + 'px';
    dot.style.fontSize = (26 + Math.floor(sr() * 60)) + 'px';
    dot.style.opacity = (0.05 + sr() * 0.12).toFixed(2);
    dust.appendChild(dot);
  }

  /* ---- 时间线（引擎寻帧协议）：2.4 + 2.6 + 3.0 + 2.2 + 1.8 = 12.0s ---- */
  var SECS = [2.4, 2.6, 3.0, 2.2, 1.8];
  var STARTS = [0];
  for (var z = 0; z < SECS.length; z++) STARTS.push(STARTS[z] + SECS[z]);
  var DUR = STARTS[SECS.length];
  var cards = [];
  for (var ci = 0; ci < SECS.length; ci++) cards.push(document.getElementById('c' + ci));
  var starEls = Array.prototype.slice.call(document.querySelectorAll('#rate .st'));
  var scoreEl = document.getElementById('score');
  var kwEl = document.getElementById('kw');
  var advEl = document.getElementById('adv');
  var rows = Array.prototype.slice.call(document.querySelectorAll('#spec .row'));
  function clamp01(x) { return x < 0 ? 0 : x > 1 ? 1 : x; }
  function ease(p) { return p * p * (3 - 2 * p); }

  window.__timelines = {
    main: {
      duration: function () { return DUR; },
      pause: function (t) {
        dust.style.transform = 'translateY(' + (-t * 6).toFixed(1) + 'px)';
        var idx = 0;
        while (idx < SECS.length - 1 && t >= STARTS[idx + 1]) idx++;
        var start = STARTS[idx], len = SECS[idx], local = t - start;
        for (var i = 0; i < cards.length; i++) {
          var el = cards[i];
          if (i === idx) {
            var fin = ease(clamp01(local / 0.25));
            var fout = ease(clamp01((len - local) / 0.18));
            el.style.opacity = (fin * fout).toFixed(3);
            el.style.transform = 'translateY(' + (46 * (1 - fin) - 30 * (1 - fout)).toFixed(1) + 'px)';
          } else {
            el.style.opacity = '0';
          }
        }
        /* c1 星级逐颗点亮 + 分数落板 */
        for (var q = 0; q < 5; q++) {
          var on = (q < D.stars) && idx === 1 && local > 0.4 + q * 0.28;
          starEls[q].className = on ? 'st on' : 'st';
        }
        scoreEl.style.opacity = (idx === 1 && local > 1.9) ? ease(clamp01((local - 1.9) / 0.3)).toFixed(3) : '0';
        /* c2 关键词/建议先后浮现 */
        kwEl.style.opacity = (idx === 2 && local > 0.2) ? ease(clamp01((local - 0.2) / 0.35)).toFixed(3) : '0';
        advEl.style.opacity = (idx === 2 && local > 0.7) ? ease(clamp01((local - 0.7) / 0.35)).toFixed(3) : '0';
        /* c3 宜忌四行依次落板 */
        for (var w = 0; w < rows.length; w++) {
          var p2 = (idx === 3 && local > 0.3 + w * 0.4) ? ease(clamp01((local - 0.3 - w * 0.4) / 0.3)) : 0;
          rows[w].style.opacity = p2.toFixed(3);
          rows[w].style.transform = 'translateY(' + (18 * (1 - p2)).toFixed(1) + 'px)';
        }
      }
    }
  };
})();
</script>
</body>
</html>
