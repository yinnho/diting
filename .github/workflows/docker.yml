name: docker

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Resolve version (tag push uses the tag; manual run uses the latest tag)
        id: ver
        # ls-remote over the network — describe needs the tag as a HEAD
        # ancestor and the shallow checkout has no history to walk.
        run: |
          ver=$(git ls-remote --tags origin 'v*' | awk -F/ '{print $NF}' | grep -v '\^{}' | sort -V | tail -1 | sed 's/^v//')
          echo "version=$ver" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ steps.ver.outputs.version }}
          build-args: |
            DITING_VERSION=${{ steps.ver.outputs.version }}
