name: docker

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Resolve version (tag push uses the tag; manual run uses the latest tag)
        id: ver
        run: echo "version=$(git describe --tags --abbrev=0 | sed 's/^v//')" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        uses: docker/login-action@5e57cd1186654e7a3d7d51e87a2ec557a50f3892
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@1a16263e66d0aea49f95cb4f393c5e29d3c76edd # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ steps.ver.outputs.version }}
          build-args: |
            DITING_VERSION=${{ steps.ver.outputs.version }}
