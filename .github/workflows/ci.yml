# Full test suite + feature-combination compile gates on every PR/push.
# Before this existed, PRs (dependabot included) ran only a 36s scan job —
# a "green" check carried zero test signal, and a Cargo.toml bump that broke
# `cargo metadata` resolution would have merged clean (see the wreq dual
# target-section pin incident, 2026-09).
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: cargo nextest (--features screenshot)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39
        with:
          tool: cargo-nextest
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          # v3 (2026-11-08): the v2 key hit the same poisoning the v1 key
          # did (2026-11-03): the cache replayed the v8 build-script
          # fingerprint without its OUT_DIR (librusty_v8.a) and every run
          # since failed at link. Fresh key = fresh cache = fresh download;
          # a stale cache self-heals on a key bump, so never reuse this key
          # across v8 asset changes.
          key: test-screenshot-v3
      - name: Test
        # #64 ⑤-3: nextest over libtest = per-process isolation (feature
        # bleed between tests in one binary dies), retries (.config/
        # nextest.toml ci profile — absorbs the 2 known timing flakes in
        # the 110-identity battery without hiding a real flake), and 2.7x
        # faster on this face. --workspace stays load-bearing: the repo is
        # a root-package workspace (crates/diting), and without it only the
        # root package runs, silently dropping the engine crate's tests.
        # Local gate (AGENTS.md) stays cargo test — same face, no extra
        # tooling required to contribute.
        run: cargo nextest run --workspace --features screenshot --profile ci
      - name: Doctests
        # nextest doesn't run doctests. The face is small and real:
        # diting_swash 17 + diting_taffy 4 — upstream doc examples double
        # as a free conformance check on the vendored API surface (the
        # other vendored families carry doctest = false per VENDORED.md).
        run: cargo test --workspace --features screenshot --doc

  webplatform-fresh:
    # JS-PLATFORM-ARCH M0: generated JS must equal what the checked-in
    # generators emit from the checked-in Chrome truth (and the truth files
    # must not drift silently). Seconds, no Rust toolchain.
    name: webplatform generated files fresh
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Freshness gate
        run: tools/webplatform/check_fresh.sh
      - name: Clean-room provenance ratchet
        run: python3 tools/check_provenance.py
      - name: Chrome-version coherence gate
        run: |
          python3 tools/apply_chrome_target.py --check
          python3 tools/check_coherence.py

  webplatform-deps:
    # JS-PLATFORM-ARCH M1: static dependency ratchet over the snapshot scripts
    # (load-time forward refs, TDZ, late-minted internal names, cross-file
    # load-time / prototype coupling may only go DOWN vs baseline.json).
    name: JS platform dependency ratchet
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install analyzer deps (pinned, lockfile committed)
        working-directory: tools/webplatform/analyze
        run: npm ci --no-audit --no-fund
      - name: Ratchet
        working-directory: tools/webplatform/analyze
        run: node analyze.mjs --check baseline.json

  clippy:
    # #27: lint gate. The disallowed list lives in clippy.toml, the enforcement
    # level (deny) in [workspace.lints.clippy] at the workspace root — this job
    # exists so the list bites. Whole workspace: the vendored wire family's
    # dead upstream test code was cut 2026-11-06 (VENDORED.md), so they build
    # under --all-targets like everyone else; their [lints] stay upstream's,
    # not the workspace table. #64: the warn-level backlog was folded to zero
    # (vendored crates got root #![allow(clippy::all)] instead — their
    # byte-shape is the diff3 sync face) and the gate flipped to -D warnings.
    name: cargo clippy (workspace, -D warnings)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          # Separate cache: clippy check fingerprints differ from the check/test
          # jobs; same v8 OUT_DIR poisoning caveat as the test job applies.
          key: clippy-v3
      - name: Clippy
        run: cargo clippy --workspace --all-targets --features stealth,screenshot -- -D warnings

  fmt:
    # #64: format gate over every house crate. Vendored trees keep upstream
    # byte-shape (the taffy-family diff3 sync face depends on it) and are
    # exempt via crates/VENDORED.md — the script reads that table, so the
    # exemption list has exactly one source of truth.
    name: cargo fmt (house crates)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt
      - name: Format gate
        run: scripts/gate_fmt.sh

  layers:
    # ARCHITECTURE.md §2 R1-R3 as greppable tripwires plus the god-file
    # ratchet (§6 P2). The compile-time guarantee is the workspace dep
    # graph; this catches what compiles fine but legislates wrong — core
    # importing a face, the engine growing a faces dep, a new 2k-line
    # file. Deliberately dependency-free python so it runs in seconds.
    name: layering audit (R1-R3)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Audit
        run: python3 scripts/audit_layers.py
