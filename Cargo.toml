# Virtual workspace（2026-11-05 结构整改 #5）：根 manifest 只做装配，
# 产品包在 crates/diting-browser/，引擎与 vendor 家族在 crates/ 下——
# 「所有代码都在 crates/」从此成立，根目录零代码。
#
# 发版/构建命令零变化：cargo build/test/fmt 在工作区根照常作用于全体成员。

[workspace.package]
# 发版号单源：只有 diting-browser 和 crates/diting 继承。wire 家族 +
# profiles 五个不继承——版本号贴上游 wreq 生态当跟踪信号（6.0.0-rc.31 等）；
# ops / runtime 的 0.1.0 纯内部号没人消费，留在原地。
version = "0.10.0"

[workspace]
members = ["crates/diting-browser", "crates/diting",
           # 引擎本体（#58 拆包）：门面 crates/diting 只 re-export
           "crates/diting_env", "crates/diting_dom", "crates/diting_css", "crates/diting_layout",
           "crates/diting_net", "crates/diting_js", "crates/diting_page",
           "crates/diting_ops",
           "crates/diting_runtime", "crates/diting_wire", "crates/diting_wire_proto",
           "crates/diting_wire_rt", "crates/diting_profiles", "crates/diting_wire_h2",
           "crates/diting_socks", "crates/diting_png", "crates/diting_html5ever",
           "crates/diting_markup5ever", "crates/diting_cssparser", "crates/diting_selectors",
           "crates/diting_swash", "crates/diting_taffy"]
resolver = "2"

# Lint 单源（2026-11-06 #27）：各成员 `[lints] workspace = true` 继承这里，
# lint 政策只动本文件。disallowed 名单本体在 clippy.toml，这里只定执行级。
# 姿势偷自 moli（lexmount/moli）的 workspace.lints 接法；他家名单里的
# std::sync 全家→parking_lot 暂不入单：现存 std::sync::Mutex 104 处/
# RwLock 12/Condvar 3，那是迁徙不是配置；wire_h2 的双后端 sync.rs 是
# 将来棘轮的模板。例外：diting_wire_h2 保留上游 h2 自己的 [lints]
# （fuzzing cfg 护栏），vendor fork 走上游纪律，本表不罩它。
[workspace.lints.clippy]
disallowed_methods = "deny"
disallowed_types = "deny"

# Unwinding is REQUIRED: ops wrap their bodies in std::panic::catch_unwind so a
# panic degrades to an error return instead of unwinding into V8's FFI frame and
# aborting the process. panic="abort" turns every catchable op panic into a crash.
# Workspace-wide: applies to every member crate (diting included).
# 2026-11-06 #27 复审（对照 moli 双 profile abort）：他家是桌面 CLI 产物，
# 我们是托管多租户服务——9 处 catch_unwind 全在承重位（JS eval 边界、
# ops 毒墙×6、字形渲染护栏、crash 边界），abort 等于拆掉「一页坏不倒
# 引擎」（#260）。审计结论：保留 unwind。
[profile.release]
panic = "unwind"
strip = true
# codegen-units 故意不设 1（moli 设 1 换紧凑工作集）：diting lib 单颗 rustc
# 峰值 anon-rss 已到 6.4G（2026-11-06 86quan 全局 OOM 实测，cgu=默认 16），
# 设 1 会进一步抬高峰值，8G 构建机必墙、16G CI 贴墙；且运行时性能不是
# 当前瓶颈（bench auto 532ms）。要动它先带 bench 数字和构建机余量再来。

# taffy 0.15.0 (2026-10-12) predates the float tail-segment fix our #300
# taffy patch pin retired 2026-11-07 (#42 ① / #46): the pinned tree
# (main rev 802e497, taken for the #300 float tail-segment fix that 0.15.1
# still lacks) is now vendored as crates/diting_taffy — same rev, our name.
# The 0.15.1-side commits are an in-tree diff batch on our clock.
[patch.crates-io]
# btls-sys 0.5.6 with ONE local patch on the bundled BoringSSL snapshot
# (mldsa-sigalgs: SSL_SIGN_MLDSA44/65/87 + GREASE passthrough — Chrome 156+
# ClientHello sigalgs lead, issue #25). Same name+version so btls 0.5.6 links
# ours; drop the patch file when upstream's snapshot learns the values.
btls-sys = { path = "crates/diting_btls_sys" }
