# Virtual workspace（2026-11-05 结构整改 #5）：根 manifest 只做装配，
# 产品包在 crates/diting-browser/，引擎与 vendor 家族在 crates/ 下——
# 「所有代码都在 crates/」从此成立，根目录零代码。
#
# 发版/构建命令零变化：cargo build/test/fmt 在工作区根照常作用于全体成员。

[workspace.package]
# 发版号单源：只有 diting-browser 和 crates/diting 继承。wire 家族 +
# profiles 五个不继承——版本号贴上游 wreq 生态当跟踪信号（6.0.0-rc.31 等）；
# ops / runtime 的 0.1.0 纯内部号没人消费，留在原地。
version = "0.9.2"

[workspace]
members = ["crates/diting-browser", "crates/diting", "crates/diting_ops",
           "crates/diting_runtime", "crates/diting_wire", "crates/diting_wire_proto",
           "crates/diting_wire_rt", "crates/diting_profiles", "crates/diting_wire_h2"]
resolver = "2"

# Unwinding is REQUIRED: ops wrap their bodies in std::panic::catch_unwind so a
# panic degrades to an error return instead of unwinding into V8's FFI frame and
# aborting the process. panic="abort" turns every catchable op panic into a crash.
# Workspace-wide: applies to every member crate (diting included).
[profile.release]
panic = "unwind"
strip = true

# taffy 0.15.0 (2026-10-12) predates the float tail-segment fix our #300
# graduation battery pinned: a float placed beside a shorter earlier float
# (e.g. a 60px left float starting beside a 50px right float's last 10px)
# had the part of its extent below the segment list's last end silently
# dropped from the FloatContext, so text lines beside that tail wrapped
# full-width. main pushed the missing segment in the end-None branch
# ("add a segment for the part of it below the last segment"); pin main
# until a release carries it. Only place_floated_box's signature moved
# (caller-defined id first param — #299's probe passes 0). The blitz git
# copy of taffy (versioned 0.14.0) is a different source and stays.
[patch.crates-io]
taffy = { git = "https://github.com/DioxusLabs/taffy", rev = "802e497b69689e1c93be2d16e9d53a973971bcb2" }
